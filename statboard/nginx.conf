# Демка отдаётся из одного образа целиком: и приложение, и ответы её ручек — моки уезжают в сборку
# файлами и лежат под `/api/`. Соседей у неё нет, поэтому и путей к ним здесь нет.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Ручки — это файлы. Нет файла, значит нет ручки, и ответ 404: иначе запрос за данными получал
    # бы страницу приложения с кодом 200, и виджет разбирал бы HTML вместо JSON.
    location /api/ {
        try_files $uri =404;
    }

    location / {
        # Маршруты приложения существуют только в браузере: без этого перезагрузка страницы внутри
        # доски даёт 404 от сервера, у которого такого файла и правда нет.
        try_files $uri /index.html;
    }
}
