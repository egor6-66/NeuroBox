[project]
name = "neurobox"
version = "0.1.0"
description = "Сервис управления агентами"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "mcp>=2.1.1",
    "pydantic-settings>=2.3",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
]

# Зависимости добавляются вместе с кодом, который их использует. Агентский цикл, слой
# провайдеров, база и очередь приедут своими фазами — заранее их тут нет намеренно.

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260815",
    "anyio>=4.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurobox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
exclude = ["alembic"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # неиспользуемые аргументы функций
    "T201",   # print запрещён — логи, а не печать
]
ignore = [
    "E501",   # длина строки — дело форматтера
    "B008",   # вызовы в значениях по умолчанию: так работает Depends
    "B904",   # raise без from: HTTPException поднимается так повсеместно
]
