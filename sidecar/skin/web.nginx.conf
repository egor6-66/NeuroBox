# Витрина и её соседи с одного источника: сервис бокса под /api, служба пресетов под /presets.
# Так витрине не нужны разрешения на чужие источники, а адреса в бандле относительные —
# одна сборка годится и на машине, и за входом.
server {
    listen 80;

    # Имена соседей разрешаются на КАЖДЫЙ запрос, а не один раз при старте: иначе nginx
    # запоминает адрес контейнера навсегда, и первый же перезапуск соседа даёт 502 при живом
    # соседе. 127.0.0.11 — служба имён докера.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Сервис бокса: чат витрины ходит сюда с токеном и логином в заголовках, они проходят как есть.
    location /api/ {
        set $service "api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$service;
        proxy_http_version 1.1;

        # Ответ чата ждётся синхронно и может идти минуты; поток событий буферизовать нельзя.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }

    # Служба пресетов: то, что агент сохранил через MCP, витрина читает отсюда.
    location /presets/ {
        set $presets "presets:8787";
        rewrite ^/presets/(.*)$ /$1 break;
        proxy_pass http://$presets;
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
