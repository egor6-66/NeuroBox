# Дорожная карта NeuroBox — источник правды по фактически сделанной работе. Статус проставляется
# рядом с работой, в момент когда она сделана — не задним числом. Формат тот же, что у роадмапов
# фреймворка (categories → items, log → журнал решений).
#
# ОСОБЕННОСТЬ этапа: сделанного почти нет — репозиторий в основании, и почти всё здесь Backlog.
# Поэтому milestone заполнен, в отличие от роадмапов, где поставки с датами нет: у сервиса
# порядок работ существенен, и фаза — это он. Категории при этом тематические, как везде.
#
# Фазы и то, чем каждая закрывается:
#   Ф0 фундамент      — чистый клон на чужой машине плюс две команды дают зелёный health
#   Ф1 ядро           — рецепт из файла поднимается, сервер опрошен, агент отвечает
#   Ф2 сессии         — сессия переживает рестарт, расход виден по каждому запуску
#   Ф3 эксплуатация   — по упавшей сессии видно, где именно и сколько стоило
#   Ф4 пульт          — работа с сервисом не требует ни курла, ни правки файлов руками
#   Ф5 модели         — тот же рецепт работает на локальной модели сменой одного паспорта

categories:
  - category: Репозиторий и основание
    items:
      - id: docs-triple-filled
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Тройка доков в корне — первое заполнение
        description: |
          Означает: словарь, границы и канон зафиксированы ДО кода, чтобы реализация шла под
          решения, а не решения задним числом под написанное. README держит решения, не
          описание несуществующего API — разбор, почему это не нарушает «дока от кода», в FAQ.md.

      - id: repo-layout
        type: plan
        status: Done
        priority: High
        milestone: Ф0
        name: Раскладка репозитория
        description: |
          Означает: четыре зоны с границами по смыслу — neurobox (сервис), config (файловый слой),
          sidecar (окружение stdio), console (пульт). У каждой своя тройка доков. Решение принято
          человеком до первого кода: структура не унаследована от донора и не сложилась сама по
          мере коммитов.

      - id: license
        type: plan
        status: Backlog
        priority: Low
        milestone: null
        name: Лицензия
        description: |
          Означает: репозиторий публичный, и без файла лицензии это формально «все права
          сохранены» — код видно, использовать его никто не вправе. Решение ОТЛОЖЕНО осознанно,
          а не забыто: пока сервисом никто снаружи не пользуется, текущее положение никому не
          мешает. Вернуться сюда до того, как появится первый сторонний потребитель.

      - id: zones-and-ownership
        type: plan
        status: Backlog
        priority: Low
        milestone: null
        name: Правила зон и владения
        description: |
          Означает: кто какую папку ведёт, и границу держит машина, а не устная договорённость.
          ОТЛОЖЕНО осознанно: пока над репозиторием работают двое и код пишет один, механизм
          разграничения охранял бы границу от самого себя. Границы зон при этом уже объявлены —
          у каждой свой README. Вернуться, когда рук станет больше.

      - id: entity-genus-for-service
        type: plan
        status: Backlog
        priority: Low
        milestone: null
        name: "Вид сущности в шапке доков (`genus`) для сервиса"
        description: |
          Означает: у фреймворка таксономия под component/engine/tooling, сервис в неё не
          попадает. Либо таксономия расширяется, либо у корня сервиса шапки нет — сейчас нет,
          как и у корня репозитория фреймворка.

  - category: Фундамент запуска
    items:
      - id: compose-stack
        type: feature
        status: Done
        priority: High
        milestone: Ф0
        name: Docker Compose — единственный способ запуска
        description: |
          Означает: две команды на чистом клоне поднимают сервис, health отвечает 200. Проверено
          прогоном, не заявлено. Сегодня поднимается один контейнер: база, очередь, воркер и
          сайдкар приезжают вместе с кодом, который их использует — контейнер, ничего не
          обслуживающий, выглядит рабочей частью системы и врёт про её готовность.

      - id: env-example-and-ignore
        type: feature
        status: Done
        priority: High
        milestone: Ф0
        name: Образец окружения и правила игнора
        description: |
          Означает: репозиторий публичный, поэтому образец переменных и игнор появились вместе с
          первым коммитом — не после первого утёкшего ключа. Плюс нормализация переводов строк:
          разработка на Windows, исполнение в Linux, а скрипт с CRLF падает внутри образа с
          «файл не найден», и причины не видно ни в диффе, ни в логе сборки.

      - id: product-skeleton
        type: feature
        status: Done
        priority: High
        milestone: Ф0
        name: Скелет сервиса по конвенциям продуктового шаблона
        description: |
          Означает: взяты конвенции — uv с группами зависимостей, раскладка api/routes плюс core,
          конфиг ruff и mypy в строгом режиме, src-раскладка пакета. НЕ взят целиком: образ
          шаблона вшивает фронт в бэкенд одной сборкой, а пульт у нас отдельная зона, поэтому
          Dockerfile свой. Живость есть, готовности нет намеренно — от чего зависеть, пока не
          существует, и вторая ручка врала бы «готов» просто потому, что проверять нечего.

      - id: ci-gate
        type: feature
        status: Done
        priority: High
        milestone: Ф0
        name: CI — линт, типы, тесты, сборка образа
        description: |
          Означает: сломанное не доезжает до основной ветки. Проверки те же, что человек гоняет
          локально, и теми же командами — расхождение «у меня работает, а в CI красное»
          начинается ровно там, где команды разъезжаются.

      - id: production-deploy
        type: feature
        status: Done
        priority: High
        milestone: Ф0
        name: Развёртывание на боевой машине
        description: |
          Означает: клон и две команды дают работающий сервис на чужой машине, а не только на
          своей. Проверено целиком на боевой: сессия, развёртка, A2A, CLI, MCP, ответ и запись
          расхода. Вход машины сюда не входит — он ничей и живёт отдельным репозиторием Gate:
          за ним больше одного продукта, и владей им бокс, он отвечал бы за доступность чужих.
          Порты наружу не публикуются вовсе, снаружи ходят через вход.

      - id: anthropic-reachability-check
        type: plan
        status: Done
        priority: Medium
        milestone: Ф0
        name: Проверка доступа к провайдеру до установки
        description: |
          Означает: перед развёртыванием проверяется, пускает ли провайдер с адреса машины.
          Первая боевая машина оказалась заблокирована — 403 на любой запрос, до всякой
          авторизации, — и выяснилось это только на живом логине, после полной установки.
          Проверка занимает секунду и стоит первой.

      - id: skin-zone-beside-agent
        type: feature
        status: Done
        priority: High
        milestone: Ф0
        name: Зона скинов рядом с агентом
        description: |
          Означает: MCP скинов и служба пресетов из чужого репозитория подняты соседями агента
          в compose, без клона чужого кода на машине — образ MCP клонирует ветку сам и замечает
          её сдвиг, служба пресетов собирается своим Dockerfile из подкаталога репозитория.
          MCP наружу не публикуется, служба пресетов — входом на 9787 по слову человека (см.
          журнал); данные пресетов на томе. Адрес MCP — `${SKIN_MCP_URL}` из
          окружения: на боевой сосед по сети докера, на ноутбуке хост. Проверено живым прогоном:
          агент сохранил палитру, запись легла в службу. Витрина поднималась и снесена в тот же
          день (см. журнал), браузерные ручки пусты.

      - id: ship-one-command
        type: feature
        status: Done
        priority: High
        milestone: Ф0
        name: Раскатка одной командой
        description: |
          Означает: `ship.ps1` с ноутбука пушит бокс и вход, `ship.sh` на машине делает pull
          обоих, сборку, подъём и проверяет каждого соседа живым запросом, а не «контейнер
          запущен». Найдено и учтено по дороге: только что поднятый node отвечает не сразу
          (проверкам даны повторы); карта входа разворачивается из шаблонов один раз при старте
          контейнера и живёт в его слое — при смене карты nginx пересоздаётся, перезапуска мало.

      - id: cors-by-list
        type: feature
        status: Done
        priority: Medium
        milestone: Ф0
        name: Чужие источники по списку
        description: |
          Означает: витрина, поднятая у разработчика на ноутбуке, ходит в ручки боевого бокса из
          браузера. `CORS_ORIGINS` — точные источники через запятую, пусто значит никому; `*`
          не годится, потому что с токеном в заголовке любая страница ходила бы сюда именем
          того, у кого токен. Слой стоит снаружи журнала: у предварительного запроса нет ни
          токена, ни логина, до ручек ему и не надо.

  - category: Конфигурация и модель
    items:
      - id: passports-seeds-recipes
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: Паспорта, семена, рецепты
        description: |
          Означает: паспорт — кто агент (провайдер, модель, лимиты), семя — минимальный
          именованный вход, разворачивающийся во много, рецепт — комбинация семян. Это предмет
          проекта, а не обвязка вокруг чужой библиотеки. Читаются с диска и отдаются по HTTP с
          меткой слоя; сломанный файл называет себя отказом и не прячет остальные.

      - id: config-layers
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: Три слоя конфигурации с видимым источником
        description: |
          Означает: образ (эталоны) → файл (личные стандарты, в гите) → база (динамика из
          пульта), каждый следующий перекрывает предыдущий. У каждого элемента метка, из какого
          он слоя — без неё три слоя превращаются в гадание, откуда взялось значение. Слой базы
          появится вместе с базой и встанет последним: порядок склейки уже её ждёт. Перекрытие
          идёт элементом целиком, а не по полям — частичное слияние двух источников дало бы
          элемент, которого нет ни в одном файле.

      - id: seed-promotion
        type: feature
        status: Backlog
        priority: Medium
        milestone: Ф1
        name: Экспорт семени слоем ниже
        description: |
          Означает: «задублировалось — вынес в дефолты» как явная операция человека. Автосинка
          базы обратно в файл запрещена — иначе гит шумит сам по себе и авторство теряется.

      - id: recipe-unfold
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: Развёртка рецепта — то, что получит агент
        description: |
          Означает: рецепт под конкретным паспортом превращается в инструкцию (тексты знание-семян
          в порядке рецепта, каждое названо заголовком) и план серверов (только опрошенных). Ничего
          не решает и никуда не ходит — складывает уже известное и называет всё, что не вошло.
          Неопрошенный сервер в план НЕ попадает: иначе агент получил бы адрес, про который никто
          не знает, работает ли он. Развёртка получается и при вердикте «слабовато» — сверка
          предупреждает, а не запрещает.

      - id: file-layer-shape
        type: plan
        status: Done
        priority: High
        milestone: null
        name: Формат файлового слоя
        description: |
          Означает: у семян одно пространство имён и два вида содержимого — серверы остаются в
          mcp.json в исходном формате (переносится копированием между инструментами), знание
          лежит маркдауном в seeds/. Рецепт перечисляет имена и природы семени не знает. Паспорт
          в рецепте не называется: человек выбирает отдельно, кем работать, и отдельно, над чем.
          Раскладка описана в config/README.md.

      - id: seed-requirements
        type: feature
        status: Done
        priority: Medium
        milestone: Ф1
        name: Требования семени к модели — подсказка, не гейт
        description: |
          Означает: семя вправе заявить минимум и рекомендуемое (контекст, вызов инструментов,
          строгий вывод), сервис сверяет это с паспортом. Поле необязательное. Исходов три и ни
          один не блокирует: подходит — тихо, слабовато — предупреждение, не с чем сравнить —
          молчание. Вес перечня тулзов сервера считается при опросе, а не заявляется руками.

      - id: baked-reference-sets
        type: plan
        status: Backlog
        priority: Low
        milestone: Ф4
        name: Что запекается в эталонные образы
        description: |
          Означает: какие именно наборы едут нулевым слоем — эталон монорепо, эталон
          MCP-сервера, что-то ещё. Пока эталонов нет, слой существует, но пуст.

  - category: MCP
    items:
      - id: own-mcp-servers
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: Свои MCP-серверы — канал от агента к боксу
        description: |
          Означает: всё, что нам нужно ОТ агента, приходит инструментами — он общается ими, и
          заводить рядом второй способ значило бы, что половина его сообщений живёт мимо общего
          канала. Первый сервер — заметки о затыках: агент зовёт ручку, когда упёрся, и заметка
          ложится в свою сессию. Сессию агент не называет: она приходит заголовком, который
          подставила развёртка — доверять его догадке о собственном контексте нельзя. Наши
          серверы НЕ привилегированные: попадают в каталог обычными семенами нижнего слоя,
          рецепт решает, давать их или нет, любой слой выше их перекрывает. Добавить сервер =
          модуль рядом и запись в реестре.

          Уточнено после разбора с человеком: репорты живут у ТОГО, чьи ручки. Наша ручка — про
          затыки САМОГО БОКСА; чужие идут в ручки репортов своих же серверов. Хранить чужие
          затыки у себя бессмысленно — сервер сменится раньше, чем их прочтут, а нужны они там,
          где живёт сам сервер. Общий петтерн: у каждого поставщика рядом с рабочими ручками
          свои ручки репортов, и форму диктует он.
      - id: mcp-registry
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: Реестр серверов — подключение, опрос, сохранение описания
        description: |
          Означает: перечень тулзов и инструкция берутся у самого сервера, а не описываются у
          нас. Заодно «прописан, но не отвечает» ловится при подключении, а не в середине
          прогона за потраченные токены.

      - id: mcp-secrets-from-env
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: "Подстановка секретов `${VAR}` из окружения"
        description: |
          Означает: конфиг лежит в гите и общий, токен принадлежит машине человека. Нет
          переменной — семя несёт названный отказ env-missing и остаётся ВИДИМЫМ, а ссылка не
          подменяется пустой строкой: пустая дала бы 401 от сервера и час поисков, названный
          отказ указывает на причину сразу.

      - id: claude-runtime-login
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: Вход в Claude Code внутри контейнера
        description: |
          Означает: подписка человека работает из контейнера без ключа провайдера. Авторизация
          и конфиг живут на именованном томе и переживают пересборку. Проверено прогоном: агент
          отвечает, инструкция через --system-prompt доезжает и меняет ответ. Вход — действие
          человека, сервис в чужой аккаунт не входит.

      - id: a2a-common-channel
        type: plan
        status: Done
        priority: High
        milestone: Ф1
        name: A2A — общий канал до агентов
        description: |
          Означает: оркестратор говорит со ВСЕМИ агентами одним открытым протоколом, а не своими
          переходниками под каждого. Агентов может быть много, они могут жить на разных машинах и
          быть написаны кем угодно — канал один. Визитка агента лежит по известному адресу и
          вычитывается, как перечень тулзов у MCP-сервера: тот же приём, другой уровень. Разбор
          выбора — в журнале.

      - id: claude-a2a-adapter
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: A2A-адаптер над Claude Code
        description: |
          Означает: снаружи общий протокол, внутри локальный CLI — оркестратор про CLI не знает и
          знать не обязан. Визитка отдаётся, задача выполняется, инструкция доезжает и меняет
          ответ. Проверено прогоном по протоколу: состояние COMPLETED, ответ получен. Конфиг
          серверов передаётся файлом, а не строкой аргументов: длинный перечень тулзов упёрся бы
          в предел командной строки и упал без внятной причины. Ключ strict-mcp-config запирает
          агента в границах рецепта — иначе он подхватил бы серверы окружения, и рецепт перестал
          бы быть границей.

      - id: mcp-sidecar
        type: feature
        status: Backlog
        priority: Medium
        milestone: Ф1
        name: "Сайдкар для `stdio`-серверов"
        description: |
          Означает: node, браузер и прочее окружение stdio-серверов заперты в отдельном
          контейнере и обёрнуты в http. Рантайм остаётся тонким и одинаковым у всех, упавший
          сервер не роняет сессии.

      - id: feedback-both-signs
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: Отзывы обоих знаков, маршрут по причине
        description: |
          Означает: ручка бокса принимает и затыки, и похвалу — по одним жалобам не видно, что
          работает. Отзыв уходит туда, где лежит ПРИЧИНА, а не туда, где о ней услышали: чужая
          ручка не дала примеров — отзыв ей, даже если человек пожаловался нам. Свой затык агент
          пишет сразу, отзыв от лица человека — только с согласия и его словами, формулировку
          предлагает сам.

      - id: identity-reaches-the-servers
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: Личность доезжает до MCP-серверов
        description: |
          Означает: сервер знает, чьим именем идёт работа, — логин уходит заголовком на каждый
          запрос. Раньше заголовки в конфиге были статические, одни на всех, и разграничить
          ресурсы по людям было не на чем. Заголовком, а не аргументом ручки: аргумент печатает
          агент, и тогда он может назваться чужим именем, а каналом он управлять не может.

      - id: unfold-probes-what-is-missing
        type: feature
        status: Done
        priority: High
        milestone: Ф1
        name: Развёртка сама добирает неопрошенное
        description: |
          Означает: перезапуск сервиса больше не обезоруживает агента. Реестр живёт в памяти, и
          после старта он пуст — развёртка молча собиралась БЕЗ сервера, агент оставался без
          ручек и честно отвечал, что ничего не умеет, а виноватым выглядел он. Теперь
          недостающее опрашивается перед прогоном, а отказ сервера ложится именованным.

      - id: builtin-tools-are-reachable
        type: plan
        status: Backlog
        priority: Medium
        milestone: Ф2
        name: Забор из `--allowedTools` дырявый
        description: |
          Означает: семя утверждает, что агенту доступны только ручки `mcp__`, а это неправда —
          в шагах видно вызов встроенной `ToolSearch`. Вреда от неё нет, но ложное утверждение в
          инструкции опаснее отсутствующего: на него опираются, когда решают, что агенту можно
          доверить. Либо забор чинится, либо инструкция перестаёт обещать то, чего не держит.

      - id: mcp-session-outlives-message
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: MCP-сессия живёт между сообщениями
        description: |
          Означает: состояние, которое сервер держит у себя между вызовами, переживает границу
          сообщения. Процесс CLI живёт сессию, а не сообщение: задачи приходят потоком через
          `--input-format stream-json`, и соединения с MCP не рвутся между ходами. Сервер,
          привязавший состояние к сессии (вкладку браузера, например), на следующем сообщении
          отдаёт его же, а не пустоту. Починено причиной, не правилом в семени: правило
          держалось бы на дисциплине агента, а причина оставалась.

  - category: Сессии и прогоны
    items:
      - id: session-lifecycle
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: Создание сессии, история, владелец
        description: |
          Означает: закрыл вкладку, вернулся завтра — история и контекст на месте, в том числе
          после рестарта сервиса.

      - id: worker-runs
        type: feature
        status: in-progress
        priority: High
        milestone: Ф2
        name: Долгий прогон в воркере
        description: |
          Означает: агент думает минутами, а соединение столько не живёт нигде между клиентом и
          сервисом. Ручка возвращает 202 сразу, прогон идёт в фоне. СЕГОДНЯ фон — задачи этого
          же процесса, и это заявлено, а не спрятано: очередь и отдельный воркер приезжают
          позже, меняется тогда только один модуль. Что процесс не переживает рестарт, видно
          честно — незавершённые прогоны при старте закрываются с причиной «оборван рестартом»,
          а не висят в «работает» вечно.

      - id: sse-stream
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: Стрим событий по SSE
        description: |
          Означает: видно, что агент делает прямо сейчас, а не только итог через две минуты.
          Клиент волен отвалиться и вернуться — прогон от этого не прекращается. Отписка при
          уходе обязательна: без неё очередь ушедшего клиента копила бы события навсегда.
          Цепочка потоковая целиком: CLI пишет событиями, адаптер переводит их в состояния
          протокола, оркестратор пересылает слушателям сессии. На живом прогоне подключение
          инструментов видно на второй секунде, текст ответа на шестой, итог на седьмой.
          Оборвавшийся без итога поток называет себя отказом — иначе прогон висел бы в
          «работает» вечно. НЕ проверено живьём: шаг «зовёт инструмент» — единственный
          доступный MCP-сервер отвечает контейнеру 403, путь покрыт только тестом.

      - id: cancel-and-timeouts
        type: feature
        status: Done
        priority: Medium
        milestone: Ф2
        name: Отмена и таймауты
        description: |
          Означает: отмена — явная операция, а не «клиент ушёл, значит хватит»: ушедший может
          вернуться, а прерванная без спроса работа стоила денег зря. Закрывает прогон тот, кто
          отменяет: у отменённой задачи собственные записи в базу уже не доезжают, и уборка
          изнутри неё молча терялась бы.

      - id: named-refusals
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: Именованные отказы значением
        description: |
          Означает: сервер не поднялся, ключа нет, лимит выбран, тулза отвергла — значение с
          конкретным именем, не исключение. По имени пульт объясняет человеку, что случилось.
          Форма взята у механики сборки фреймворка, где отказ правки — тоже значение.

      - id: context-beside-the-reply
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: Контекст приложения рядом с репликой
        description: |
          Означает: приложение сообщает, где находится человек — страница, компонент, выбранный
          вариант, — и это доезжает до агента ПОМЕЧЕННЫМ как данные. Раньше положить было некуда:
          в сообщении жило одно поле, текст, и приклеенный к нему контекст агент принимал за
          слова человека и отвечал на них. Содержимое мы не разбираем: про компоненты знает тот,
          кто их показывает. Контекст свой у каждой реплики — человек переходит между
          страницами, и помнить его состояние между ходами значит однажды соврать про него.

      - id: did-what-the-agent-touched
        type: feature
        status: Dropped
        priority: High
        milestone: Ф2
        name: В итоге прогона едет `did` — чем агент воспользовался
        description: |
          Означает: тому, кто показывает результат, приходит список наблюдённых вызовов с
          сервером, ручкой и опознавательными аргументами — по нему решают, что перезапросить и
          на что переключиться. Именно наблюдённых: спросить агента «что ты сделал» значило бы
          завести второй источник правды. Мы не толкуем, какой вызов что значит — словарь ручек
          принадлежит их владельцу. Крупные значения заменяются пометкой: тело перезапрашивают у
          источника, и гнать его обратно значит платить за один груз дважды.

      - id: agui-is-the-way-in
        type: feature
        status: in-progress
        priority: High
        milestone: Ф2
        name: AG-UI как единственный вход
        description: |
          Означает: бокс говорит открытым протоколом, а не своей выдумкой. Конверт несёт поток,
          прогон, всю беседу, объявления инструментов и произвольные свойства; ответ — поток
          событий со штатными именами. Своя форма запроса, свои имена событий и `did` уходят:
          вызов инструмента и его результат есть в протоколе, и второй способ рассказать то же
          самое однажды разошёлся бы с первым.

          Идентификаторы потока и прогона называет ПОТРЕБИТЕЛЬ. Своих не заводим: двух имён на
          одну вещь не бывает, а чей разговор — решает тот, кто его ведёт.

      - id: two-kinds-of-runtime
        type: plan
        status: Backlog
        priority: High
        milestone: Ф5
        name: Два рода рантайма за одним входом
        description: |
          Означает: «кто помнит разговор» перестаёт быть вопросом про бокс и становится
          свойством паспорта.

          Готовый агент (Claude Code) помнит сам и сам крутит цикл — от потребителя берётся
          последняя реплика, состояние зон между ходами живёт. Цена названа: переписать прошлое
          в таком паспорте нельзя.

          Сырая модель (локальная, чужая по ключу) не помнит ничего — беседа приходит целиком и
          цикл наш. Памяти между ходами нет по построению, терять нечего.

          Один вход, один протокол; разница только в выборе паспорта.

      - id: storage-is-a-slot
        type: feature
        status: in-progress
        priority: High
        milestone: Ф2
        name: Хранение сведено к слоту
        description: |
          Означает: истории разговора у бокса нет. Остаётся пара «последний вход / последний
          выход» на поток, которая перезаписывается каждым ходом, — чтобы оборванное соединение
          не оставило человека без результата: работа сделана, деньги потрачены, ответа он не
          увидел.

          Прежняя копия переписки была именно копией: для работы агента она не использовалась
          ни разу, только для чтения ручкой и показа в пульте. На десяти людях это удобство, на
          тысяче — чужие переписки, за сохранность которых мы не обязаны отвечать.

      - id: reconnect-to-a-live-run
        type: feature
        status: Backlog
        priority: High
        milestone: Ф2
        name: Переподключение к живому прогону
        description: |
          Означает: оборвалась связь — вернулся и дочитал тот же поток. Сейчас поток только
          живой: пропустил события, пока переподключался, — потерял их насовсем, хотя прогон
          продолжается и деньги тратятся. Слот спасает только итог, а не ход дела.

      - id: sandboxes-per-session
        type: plan
        status: Backlog
        priority: Medium
        milestone: Ф5
        name: Песочница на сеанс
        description: |
          Означает: рантайм получает своё окружение, а не общее на всех. Пока у агента только
          чужие ручки, общий контейнер допустим — все права живут в зонах. Понадобится ровно
          тогда, когда рантайму дадут что-то своё: рабочую копию репозитория, оболочку, диск.

      - id: console-knowingly-broken
        type: plan
        status: Backlog
        priority: Low
        milestone: Ф4
        name: Пульт не работает — известное состояние
        description: |
          Означает: со сменой входа пульт перестал работать, и это решение человека, а не
          поломка. Код остался на месте, страница открывается, разговор и сессии в нём отвалились.
          Человек сказал не трогать: он вернётся к нему позже и, возможно, перепишет на витрине.

      - id: conversation-mirror
        type: plan
        status: Dropped
        priority: High
        milestone: Ф2
        name: Зеркало беседы для агента
        description: |
          Означает: у разговора два тела. Оригинал — для человека: полная переписка, как он её
          вёл, ничего не выброшено. Зеркало — для агента: те же сообщения, сжатые до смысла и
          главных решений, без воды.

          Зачем: агенту каждый ход отправляется вся беседа целиком, и она перечитывается заново.
          Значит длина разговора превращается в постоянный налог на каждое следующее сообщение —
          на четырёх ходах чтение кэша дошло до 396k токенов при работе на полторы тысячи.
          Урезать оригинал нельзя: человек ходит в него за историей, и «мы сократили вашу
          переписку» — это потеря его данных, а не оптимизация.

          Чем сжимать и когда — НЕ решено. Очевидные развилки, которые придётся пройти: кто
          пишет зеркало (та же модель, модель попроще, правила без модели), в какой момент (на
          каждом ходу, пачками, по порогу длины), что запрещено терять (принятые решения,
          названия созданного, договорённости), и как человеку увидеть, что агент помнит не то,
          что он говорил. Записано как задача, а не как решение.

  - category: Данные и доступ
    items:
      - id: database-foundation
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: База, миграции и модель хранения
        description: |
          Означает: постгрес в compose, схема приводится в порядок ДО того, как сервис начнёт
          отвечать — иначе первый запрос приходит на базу, которой код уже не соответствует.
          Хранится только то, что переживает рестарт: сессии, сообщения, прогоны, расход;
          каталог в базе НЕ лежит, он приходит слоями с диска. Идентичность сессии и прогона
          взята у протокола (контекст и задача A2A), своя не выдумана — иначе пришлось бы
          держать две и сводить их. Развёртка запоминается вместе с прогоном: рецепт назавтра
          другой, а разбор нужен по тому, что было на момент запуска. Незамеренный расход
          остаётся пустым, а не изображает ноль.
      - id: users-and-login
        type: feature
        status: in-progress
        priority: High
        milestone: Ф1
        name: Пользователи и логин
        description: |
          Означает: сделан ШОВ «кто пришёл» — одно место, через которое ходят все ручки. Он
          проверяет общий токен из окружения и берёт владельца из заголовка логина: токен
          отвечает «можно ли сюда вообще», логин — «чьим именем», запрос без любого из двух
          отбивается. Сессии живут по владельцам — у каждого логина свой агент. Логин — опознание,
          а не вход: его называет пришедший, проверить нечем, и это названо честно; круг тех, кто
          может назваться, ограничен токеном. Завтра то же место спросит внешний модуль
          авторизации, который у человека уже в планах, и поменяется одна функция. Своей таблицы
          пользователей и паролей НЕТ намеренно: их пришлось бы выкинуть с приходом модуля, а до
          тех пор они создавали бы иллюзию настоящего входа. Вне разработки без токена сервис не
          поднимается — иначе однажды окажется открыт, и никто не заметит.

      - id: usage-accounting
        type: feature
        status: Done
        priority: High
        milestone: Ф2
        name: Учёт токенов и стоимости в своей базе
        description: |
          Означает: ответ на каждый вызов модели несёт потраченные токены — складываем их в
          момент вызова, потому что другого места, где эта цифра есть, не существует. Кэш
          считается ОТДЕЛЬНО: на живом прогоне вышло 2 и 5 обычных токенов против 3402 и 9876
          кэшевых, то есть учёт без кэша показывал бы почти ноль там, где потрачено четыре
          цента. Деньги хранятся целым числом миллионных долей: дробные типы копят ошибку.
          Расход пишется и у провалившегося прогона — неудачная попытка тоже стоила денег, и
          квота, которая её не видит, врёт. Незаявленное остаётся пустым, а не изображает ноль:
          «бесплатно» и «не сказали» разные вещи.

      - id: roles-model
        type: plan
        status: Backlog
        priority: Medium
        milestone: Ф4
        name: Модель ролей
        description: |
          Означает: что умеет владелец, что админ, где живут квоты и что происходит при их
          исчерпании. Навешивается поверх готовой модели пользователя, фундамент не трогает.

  - category: Наблюдаемость
    items:
      - id: readiness-vs-liveness
        type: feature
        status: Done
        priority: Medium
        milestone: Ф3
        name: Готовность отдельно от живости
        description: |
          Означает: контейнер не считается здоровым, пока не готов работать. Иначе трафик
          приходит на сервис, который сразу отказывает, и оркестратор этого не замечает. Живость
          и готовность — две ручки: /health про «процесс отвечает», /ready про «база отвечает».
          Готовность объясняет, ЧТО не так, а не отдаёт пустой отказ: иначе за причиной надо
          лезть в логи.

      - id: request-logs
        type: feature
        status: Done
        priority: Medium
        milestone: Ф3
        name: Логи с идентификатором запроса и таймингами
        description: |
          Означает: тридцатисекундный прогон без этого — чёрный ящик: видно, что было плохо, и
          не видно, где. Идентификатор берётся из заголовка, если пришёл (сквозной след через
          несколько сервисов важнее нашей аккуратности в выдаче имени), и возвращается в ответе —
          иначе человек не может назвать запрос, о котором спрашивает. Тянется контекстом, так
          что работа, продолжившаяся ПОСЛЕ ответа клиенту, пишется под тем же следом. В
          разработке одна строка на запись для глаз, иначе объект для сборщика логов.

      - id: run-traces
        type: feature
        status: Backlog
        priority: Low
        milestone: Ф3
        name: Трейсы прогонов
        description: |
          Означает: отладка того, что происходило внутри цикла. Отдельно от учёта расхода —
          учёт живёт в своей базе и от трейсера не зависит.

  - category: Пульт
    items:
      - id: console-entities
        type: feature
        status: Done
        priority: Medium
        milestone: Ф4
        name: Сессии, рецепты, семена, паспорта
        description: |
          Означает: то же, что умеет API, но глазами и мышкой. Пульт не получает своих
          возможностей мимо API — иначе появится второй способ делать одно и то же. Сделан на
          рыночных пакетах и заявлен временным: когда выйдет фреймворк, будет переписан на нём,
          поэтому здесь нет ни своей системы оформления, ни роутера. Пульт и сервис отдаются с
          одного источника — так не нужны разрешения на чужие источники, а поведение в
          разработке и в сборке не расходится.

      - id: console-usage
        type: feature
        status: Backlog
        priority: Medium
        milestone: Ф4
        name: Расход и квоты
        description: |
          Означает: кто сколько потребляет — вопрос, ради которого база и заводилась.

  - category: Провайдеры и модели
    items:
      - id: provider-layer-openai
        type: feature
        status: Backlog
        priority: High
        milestone: Ф1
        name: Слой провайдеров, первый — OpenAI
        description: |
          Означает: смена модели должна быть сменой паспорта, а не правкой кода агента. Слой
          стоит один раз и почти ничего не стоит, пока провайдер один.

      - id: local-model-engine
        type: feature
        status: Backlog
        priority: Low
        milestone: Ф5
        name: Локальный движок за тем же слоем провайдеров
        description: |
          Означает: тяжёлая зависимость ставится отдельным набором, движок грузится по первому
          запросу, отсутствие весов отдаётся внятным отказом. Форма проверена на предыдущем
          сервисе генерации — переносится решение, не код.

log:
  - id: class-shift-generator-to-runtime
    type: plan
    date: 2026-09-05
    summary: >
      Донором послужил сервис генерации из другого репозитория — намеренно тупой: один запрос,
      один ответ, без состояния, без базы, без стриминга. Разбор кода показал, что переносить
      его как основание нельзя: NeuroBox stateful, а это не доработка, а другой класс сервиса.
      Из донора берётся ОДНО решение — сменный движок за узким контрактом с ленивой загрузкой и
      отдельным набором тяжёлых зависимостей; оно пригодится на фазе локальных моделей. Заодно
      в доноре зафиксированы дефекты, которые повторять не надо: гонка на ленивой инициализации
      модели, непотокобезопасный движок под пулом потоков, выброшенные причина остановки и
      расход токенов, здоровье, зелёное без работоспособности.

  - id: vocabulary-shared-with-framework
    type: plan
    date: 2026-09-05
    summary: >
      Словарь взят у фреймворка целиком, а не изобретён: анатомия/паспорт/ИО/настройки/состояния
      — декларация, сборки/рецепт — доказательство. Разложился без натяжки. Паспорт — КТО агент
      (провайдер, модель, лимиты); рецепт — С ЧЕМ работает, и это ровно «съёмный слой, который
      сущность не носит в себе», как плагины у движка; семя — минимальный вход, порождающий
      много, как семя цвета даёт всю половину шкалы. Промежуточные названия «пресет» и «блок»
      отклонены тем же правилом, которым словарь и держится: смысл не переизобретается под
      другим словом.

  - id: capability-declaration-dropped
    type: plan
    date: 2026-09-05
    summary: >
      Рассмотрена и отвергнута схема, где рецепт заранее объявляет способности агента, а сервис
      проверяет полноту заявки относительно паспорта — по образцу того, как скин обязан
      адресовать каждое состояние компонента. Причина отказа: у компонента перечень частей
      конечен и лежит в паспорте, поэтому проверка сводится к разности двух множеств; у агента
      такого перечня нет и быть не может — MCP-сервер сам отдаёт свои тулзы и инструкцию, и
      агент узнаёт возможности в рантайме. Дублировать это в рецепте значило бы делать
      выдуманную работу, которая ещё и разъедется с сервером при первом его обновлении.
      Решение зафиксировано, чтобы его не переоткрывали заново.

  - id: agent-layer-pydantic-ai
    type: plan
    date: 2026-09-05
    summary: >
      Агентский цикл берётся готовым, не пишется свой. Выбор между Pydantic AI и LangGraph решён
      в пользу первого: агенты MCP-центричные, огромный контекст и чекпойнты им не нужны, а
      LangGraph платит за них графовым API и весом. Сила лежит в MCP-серверах, а не во
      внутреннем графе агента. Провайдеры при этом уезжают за отдельный слой сразу, хотя сегодня
      нужен только OpenAI — иначе локальные модели, уже стоящие в плане, потребуют переписывать
      вызовы вместо смены паспорта.

  - id: mcp-http-canon-stdio-in-sidecar
    type: plan
    date: 2026-09-05
    summary: >
      Транспорт MCP разложен на два и разведён по разным местам. Канон — http: адрес и токен, и
      больше рантайму ничего не нужно. Серверы stdio приносят с собой окружение (node, браузер,
      файлы чужих репозиториев) — ставить это в основной образ значит распухший образ, у каждого
      свой, и «пара команд на любой машине» превращается в сборку под себя. Поэтому stdio живёт
      в сайдкаре и оборачивается в http. Дополнительный довод пришёл позже: где серверу нужен
      браузер — это забота сервера, к агенту приходят готовые снимки и узлы через его же api,
      так что тонкий рантайм не ограничение, а прямое следствие устройства MCP.

  - id: standalone-repo
    type: plan
    date: 2026-09-05
    summary: >
      Сервис вынесен отдельным репозиторием, а не пакетом в монорепо фреймворка. Общее у них —
      словарь и бренд, а не сборка: фреймворк публикуется пакетами, сервис разворачивается
      контейнером. Держать их в одном дереве значило бы делить рабочее пространство пакетов, CI
      и докер-раскладку между двумя разными способами доставки ради совпадения слов. Цена
      признана и принята: канон и словарь синхронизируются руками.

  - id: state-in-db-not-memory
    type: plan
    date: 2026-09-05
    summary: >
      База принята без развилки. Довод человека: дальше роли доступа и учёт, кто сколько
      потребляет — в памяти процесса ни то, ни другое не живёт. Отсюда сразу два следствия,
      заложенные с первого дня, а не позже: владелец у сессии (добавить его к живым сессиям
      потом значит выбирать, кому их приписать, и ответ будет неправдой) и запись расхода в
      момент вызова модели, а не восстановление по логам задним числом.

  - id: nginx-resolves-names-once
    type: plan
    date: 2026-09-06
    summary: >
      Пульт отдавал 502 при живом сервисе. Причина неочевидная и стоит запоминания: nginx
      разрешает имена в proxy_pass ОДИН раз при старте и держит адрес вечно. Контейнер сервиса
      перезапустился, получил другой адрес, и посредник продолжил стучаться в старый — при этом
      из того же контейнера сервис прекрасно доставался по имени, что и сбивает с толку при
      разборе. Лечится разрешением имени на каждый запрос через службу имён докера. Заодно
      выключена буферизация: без неё шаги прогона копились бы у посредника и приходили пачкой в
      конце, то есть ровно тогда, когда они уже не нужны.

  - id: conversation-memory-belongs-to-the-adapter
    type: plan
    date: 2026-09-06
    summary: >
      Кто решает, продолжать беседу или начинать, — переигранное решение. Сначала это делал
      оркестратор: у CLI два несовместимых ключа (завести беседу с заданным именем и продолжить
      существующую), каждый ошибается не к месту, и казалось, что надёжная память есть только у
      того, у кого база. Живой прогон показал, что это неверно: отменённый прогон беседу УЖЕ
      завёл, а по записям оркестратора она выглядела несостоявшейся — следующий запуск падал на
      занятом имени. Признак «был удачный прогон» и факт «беседа существует» разные вещи, и
      подменять второе первым нельзя. Владеет фактом тот, кто беседу заводил, то есть адаптер:
      он и держит соответствие контекста беседе, причём идентификатор берёт тот, который CLI
      назначил себе сам, — своего не навязывает, иначе однажды упрётся в занятое имя. Заметка
      лежит на отдельном томе, а её незапись не роняет удавшийся прогон: это ухудшение (разговор
      потеряется при перезапуске адаптера), а не провал работы, и причина уходит в поток ошибок,
      а не проглатывается.

  - id: a2a-instead-of-own-channel
    type: plan
    date: 2026-09-05
    summary: >
      Канал до агентов взят готовым, а не придуман. Задача — оркестратор общается с разнородными
      рантаймами (сегодня Claude Code, завтра локальная модель, послезавтра чужой сервис) через
      ОДИН механизм. Ресёрч показал открытый протокол A2A с официальными SDK под python и
      javascript от самого проекта, и решает он ровно её: непрозрачные агенты, JSON-RPC поверх
      HTTP, поток через SSE, жизненный цикл задачи, визитка агента по известному адресу. Важно не
      путать слои: MCP это агент и его инструменты, A2A это оркестратор и агенты, AG-UI это агент
      и интерфейс — три разных протокола на трёх разных стыках. Совпадение с нашей моделью
      оказалось точным: визитка A2A это ровно наш паспорт, только стандартизованный снаружи и
      ВЫЧИТЫВАЕМЫЙ, тем же приёмом, что перечень тулзов у MCP-сервера. Отвергнут вариант со своей
      тонкой ручкой в сайдкаре — это был бы тот же A2A, только самодельный и хуже. Отвергнут и
      доступ сервиса к docker-сокету: агента на другой машине через сокет не запустишь, а через
      A2A это просто ещё один адрес, и сервис не получает власти над машиной. Цена признана:
      протокол молодой, спека двигается, привязка означает принять её темп.

  - id: unfolding-is-a-new-word
    type: plan
    date: 2026-09-05
    summary: >
      Результату разворота рецепта понадобилось имя, и это НОВОЕ слово в общем словаре, а не
      синоним существующего. «Сборка» занята и значит другое — прогнанное доказательство, что
      декларация работает. «Рецепт» это вход, а не результат. Развёртка — именно результат: во
      что рецепт превратился под конкретным паспортом при текущем состоянии реестра. Слово
      выбрано по метафоре семени, которая уже держит весь словарь: семя разворачивается во
      много, значит и набор семян разворачивается. Правило «не переизобретать существующее под
      другим словом» этим не нарушено — нарушением был бы синоним, а не имя для того, у чего
      имени не было.

  - id: seed-requirements-advisory-not-gate
    type: plan
    date: 2026-09-05
    summary: >
      Возвращение к отклонённой раньше идее машинной проверки — но с другой стороны и уже
      работоспособное. Прежняя схема требовала, чтобы рецепт заявил способности агента, и
      провалилась из-за отсутствия мерила. Здесь мерило есть: семя знает, чего требует, паспорт
      знает, что даёт, и сравнение снова механическое. Проверяются только те требования, у
      которых есть настоящий двойник в паспорте — контекст, вызов инструментов, строгий вывод;
      непроверяемое («нужна умная модель») выносится отдельным полем-подсказкой и называется
      подсказкой. Вес перечня тулзов сервера при этом считается опросом, а не заявляется автором:
      он этой цифры знать не может, а сервис может. Проверка НЕ блокирует ни в одном случае —
      перечень моделей открытый, и сервис, отказавшийся работать из-за незнакомой модели, был бы
      хуже, чем сервис без проверки вовсе. Отсюда третий исход «не с чем сравнить», отличный и от
      «подходит», и от «слабовато».

  - id: config-three-layers-manual-promotion
    type: plan
    date: 2026-09-05
    summary: >
      Конфигурация гибридная в три слоя: образ (эталоны, ставятся туда, где нужны), файл (личные
      стандарты, лежат в гите и ездят с человеком), база (динамика конкретной установки). Свести
      к двум можно, но тогда либо эталон нельзя раздать образом, либо личный стандарт нельзя
      увезти с собой. Промоушен «задублировалось — вынес в дефолты» работает на уровне СЕМЯН и
      только вручную: автосинка базы обратно в файл отклонена, потому что каждое движение мышкой
      порождало бы изменение рабочего дерева, а история перестала бы отвечать, кто и зачем это
      решил.

  - id: neighbour-on-one-machine
    type: plan
    date: 2026-09-07
    summary: >
      Бокс переезжает на машину, где уже живёт другой продукт человека, и вход у машины один.
      Вход решено вынести отдельным репозиторием, не принадлежащим ни одному из соседей: владей
      им бокс — он отвечал бы за доступность чужого продукта. Соседей развели по ПОРТАМ, а не по
      путям общего порта: браузер различает места по схеме, имени и порту, но не по пути, поэтому
      общий порт означал бы для него одно место — общее хранилище, общие права, доступ к чужому
      API от имени вошедшего, и дыра в одном продукте становилась бы дырой в другом при полном
      отсутствии общего кода.

  - id: token-left-the-cookie
    type: feature
    date: 2026-09-07
    summary: >
      Токен переехал из куки в локальное хранилище. Куки браузер по портам НЕ разделяет, поэтому
      разведение соседей по портам их не спасает: кука пульта уезжала бы соседу с каждым запросом
      к нему, унося токен в чужие логи. Кука была выбрана раньше не от хорошей жизни — источник
      событий браузера не умеет задавать заголовки; теперь поток читается обычным запросом с
      заголовком, а разбор кадров и возврат после обрыва делаются руками, потому что источник
      возвращался сам, а запрос нет. Сервис куку больше не принимает, и это закреплено тестом:
      иначе её вернут «для удобства», а вместе с ней и утечку.

  - id: first-machine-was-blocked
    type: plan
    date: 2026-09-07
    summary: >
      Первая боевая машина оказалась непригодна: её адрес получал 403 «Request not allowed» на
      любой запрос к api.anthropic.com и console.anthropic.com, при том что с машины человека тот
      же адрес отвечает нормально. Блокировка по адресу, а не ошибка входа — там не заработали бы
      ни подписка, ни ключ. Обходить не стали, переехали. Проверка доступа к провайдеру поставлена
      первым шагом установки: она занимает секунду, а стоила целого круга работы.

  - id: deploy-found-what-local-never-would
    type: feature
    date: 2026-09-07
    summary: >
      Живое развёртывание вскрыло дыру, невидимую на своей машине: на чистой установке разговор
      нельзя было завести вовсе. Список агентов пуст, пока их не опросили, а пульт опрашивать не
      умел — ручка была объявлена в клиенте и ни разу не использована. У серверов зеркало сделано
      правильно («спроси, что известно, опроси, если пусто»), у агентов не довели. На машине
      разработчика всё давно опрошено, поэтому дыры не видно ни глазами, ни тестами.

  - id: feedback-routes-by-cause
    type: plan
    date: 2026-09-07
    summary: >
      Правило отзывов переписано по существу. Было «репорт идёт тому, чьи ручки подвели» — неверно:
      человек жалуется тому, с кем говорит, а причина лежит где угодно. Стало «отзыв идёт туда, где
      ПРИЧИНА»: не понравились цвета, а примеров сочетаний агенту никто не давал — беда того, кто
      их не дал. Агент называет адресата вслух, чтобы человек успел поправить промах. Знак отзыва
      теперь оба: по одним жалобам не видно, что работает, и чинить начинают исправное. Своё —
      сразу и без спроса, чужое от лица человека — только с согласия и его словами.

  - id: state-dies-with-the-message
    type: feature
    date: 2026-09-07
    summary: >
      Найдено и признано долгом: сайдкар запускает CLI новым процессом на каждое сообщение, и
      вместе с процессом умирают все соединения с MCP. Сервер, держащий состояние между вызовами
      (вкладка браузера у зоны скинов), на следующем сообщении отдаёт пустоту, а агент этого не
      замечает — он помнит, что уже открывал страницу, и объяснит пустоту как угодно. Обсуждались
      правило в семени («переход и снимок одним действием») и заявка на чужую сторону; оба
      отвергнуты как обход. Чиним причину: долгоживущий процесс на сессию.

  - id: long-lived-process-closes-the-debt
    type: feature
    date: 2026-09-08
    summary: >
      Долг закрыт: процесс CLI живёт сессию, задачи приходят потоком через `--input-format
      stream-json`, и каждая заканчивается своим итоговым отчётом с расходом. Живым прогоном
      проверено: один процесс, два хода, второй помнит первый, идентификатор беседы стабилен.
      Ходы в процессе строго по одному — беседа одна, параллельные сообщения в ней
      перемешались бы. Отмена — просьбой (управляющий запрос interrupt в тот же поток), а не
      ударом по процессу: с процессом умерли бы соединения MCP, ради которых он и живёт; не
      понял просьбу — убивается с запасом времени. Развёртка уходит в аргументы запуска, и её
      смена означает смену процесса — новый поднимается с --resume, беседа продолжается ценой
      состояния серверов, и это честная цена за новую развёртку. Той же монетой оплачен простой:
      процесс без работы гасится по таймауту (машина общая, забытые процессы с браузерами съели
      бы её), а беседа возрождается через --resume.

  - id: owner-comes-from-the-login-header
    type: feature
    date: 2026-09-08
    summary: >
      Владелец сессий переехал из настройки в заголовок логина. Витрина человека шлёт с каждым
      запросом логин юзера и общий токен; запрос без любого из двух отбивается 401 — сессии
      живут по владельцам, и безымянный запрос пришлось бы приписывать выдуманному. Токен и
      логин разведены по ролям: токен — «можно ли сюда вообще», логин — «чьим именем». Логин
      НЕ проверяется, и это названо, а не спрятано: он опознание до прихода общего модуля
      авторизации, а круг тех, кто может назваться, ограничен токеном. В разработке без токена
      вход по-прежнему открыт, но названный логин уважается — витрина проверяется локально тем
      же способом, что в бою. Пульт получил поле логина рядом с токеном; предел владельца в
      базе (64 знака) отбивается словами до записи, а не ошибкой базы.

  - id: one-instance-per-user-for-now
    type: plan
    date: 2026-09-08
    summary: >
      Вопрос «инстансы под разделы» закрыт решением человека, но временным: пока каждому
      пользователю — ОДИН инстанс агента на все задачи, без деления на сборку компонентов,
      цвета и моки. Довод: чёткого флоу ещё нет, и резать по разделам сейчас значило бы угадывать
      границы, которые никто не прощупал. Деление вернётся, когда насобираются отзывы и флоу
      станет виден — по факту работы, а не по предположению. Вопросы флоу решаются по ходу дела,
      это тоже решение, а не отсутствие решения.

  - id: cost-was-counted-thrice
    type: feature
    date: 2026-09-08
    summary: >
      Учёт денег врал почти втрое. Рантайм называет накопительный итог беседы, а не цену хода, и
      мы клали его как есть: число росло от прогона к прогону само по себе, а сумма по прогонам
      давала то, чего никто не платил — $5.50 вместо $2.07 на четырёх ходах. Вскрылось при
      сверке с прайсом: четвёртый ход, самый дешёвый по работе, оказался «самым дорогим».
      Теперь пишется разница с уже записанным по сессии, считается по базе, а не по памяти
      процесса. На этой сумме строятся квоты и роли, поэтому цена ошибки не косметическая.

  - id: did-is-observed-not-told
    type: plan
    date: 2026-09-09
    summary: >
      Потребителю результата мало текста агента: надо знать, что перезапросить и на что
      переключиться. Обсуждались два источника — рассказ самого агента и наблюдение за его
      вызовами. Взято наблюдение: рассказ был бы вторым источником правды, который однажды
      разойдётся с первым, и разойдётся молча. Толкование оставлено потребителю: словарь ручек
      принадлежит их владельцу, и зашитый у нас список «меняющих» разошёлся бы с ним на первом
      же обновлении чужой зоны.

  - id: fence-has-holes
    type: feature
    date: 2026-09-09
    summary: >
      В шагах прогона видно вызов встроенной ручки CLI (`ToolSearch`) — при том что права
      выдаются шаблоном `mcp__<сервер>__*`, а семя прямо говорит агенту, что ничего, кроме
      `mcp__`, он вызвать не может. Вреда от этой ручки нет, но утверждение ложное, а на него
      опираются, решая, что агенту можно доверить. Заведено в план: либо чинить забор, либо
      перестать обещать то, чего он не держит.

  - id: a-false-report-cost-them-a-day
    type: plan
    date: 2026-09-09
    summary: >
      Отправили в чужую зону заявку о дефекте, которого нет: «author не подставляется из
      заголовка». Автор подставлялся верно и лежал внутри `state`, а мы читали верхний уровень
      конверта. Их сторона потратила время на разбор, перепроверила код и хранилище, удалила
      наши тестовые записи — и всё это впустую. Причина не в спешке, а в подмене: своё чтение
      было выдано за факт о чужом хранилище. Правило: заявляя «поле не приходит», сначала
      посмотреть ВЕСЬ ответ, а не то место, где его ждали; и формулировать наблюдением («в поле
      верхнего уровня пусто»), а не выводом («сервер не подставляет»).


  - id: foreign-code-builds-only-in-its-own-graph
    type: feature
    date: 2026-09-09
    summary: >
      Чужой монорепозиторий на чистом клоне не собрался ни одной из двух команд, которыми
      его собирают авторы: `pnpm install` падает на хуке `prepare` пакета сборки, потому что
      хук идёт раньше, чем собран его же сосед, а кит компонентов собирается из порождённых
      файлов, которых в репозитории нет по замыслу. У авторов порядок держит nx и живой
      кеш, у нас — ни того, ни другого. Порядок назван руками в Dockerfile, в их репозиторий
      ничего не вносилось: чинить чужую сборку под свой способ запуска значило бы взять на
      себя её сопровождение. Записано, чтобы при следующем обновлении ветки не искать заново.
  - id: a-workaround-is-not-a-fix
    type: plan
    date: 2026-09-09
    summary: >
      Витрина зоны скинов поднялась без иконок: `Icon` кита ищет `lucide-solid` через
      `import.meta.glob` по относительному пути, который после сборки в `dist/index.jsx` ведёт
      в корень монорепозитория, где pnpm пакет не поднимает. Я поставил в Dockerfile ссылку в
      корне — иконки появились, и человек снёс витрину: обход чужого дефекта без спроса
      маскирует его и переносит сопровождение чужой сборки на нас. Правило: дефект чужого кода
      только докладывается, фактами и причиной; чинит владелец, у себя. Витрина вернётся после
      его правок. Сюда же: устройство чужих сущностей (как звать сессии) — не наш вопрос, бокс
      описывает только то, что делает сам.

  - id: presets-opened-on-his-word
    type: plan
    date: 2026-09-09
    summary: >
      Служба пресетов опубликована входом на 9787 без авторизации — для разработки витрины с
      ноутбука против боевых данных. Цена названа человеку до открытия и записана в самом
      файле соседа: кто знает адрес, тот читает и пишет. Первым предлагался SSH-туннель без
      публикации; человек выбрал открыть. Публикацию порта в compose входа он вписал сам —
      это действие классификатор мне не дал, и обходить его я не стал.

  - id: the-reset-who-keeps-the-pile
    type: plan
    date: 2026-09-12
    summary: >
      Разговор о переработке пришлось обнулить: я запутал человека и увёл не туда. Разбор начисто
      дал ту картину, которой не хватало. Модель — чистая функция и не помнит ничего, одинаково
      локальная и чужая по ключу. Помнит АГЕНТ — программа вокруг модели, которая хранит беседу и
      отправляет её целиком на каждый ход. Claude Code это агент, TanStack AI это агент. Агент в
      цепочке должен быть ОДИН, иначе в контексте оказываются две копии разговора.
      Отсюда роль бокса: менеджер рантаймов, а не агентский фреймворк. Цикл нужен ему только там,
      где у рантайма своего нет.

  - id: our-copy-of-the-conversation-was-dead-weight
    type: feature
    date: 2026-09-12
    summary: >
      Проверено по коду: целиком переписку мы агенту никогда не отправляли — уезжала одна новая
      реплика, а кучу собирал и пересылал Claude Code. Значит наша таблица сообщений была ВТОРОЙ
      копией того, что и так хранит он, и для работы не использовалась ни разу: только чтение
      ручкой и показ в пульте. Я объяснял её нужду неверно — «модель не помнит, поэтому храним», —
      подменяя «кто-то должен пересылать» на «это должны быть мы». Копия убрана.

  - id: memory-is-a-passport-property
    type: plan
    date: 2026-09-12
    summary: >
      Беспамятность агента и живое состояние MCP между ходами несовместимы: память и соединения
      держит одна и та же программа, и, заставив её забыть разговор, мы рвём соединения — вместе с
      вкладкой браузера чужой зоны. Обсуждались три выхода. Принят тот, где выбор вообще не про
      бокс: «кто помнит» становится свойством ПАСПОРТА. Готовый агент помнит сам, состояние живёт,
      прошлое переписать нельзя. Сырая модель не помнит, беседа приходит целиком, состояния между
      ходами нет по построению.

