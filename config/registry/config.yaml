# Приватный реестр пакетов. Полигон выпуска @web-core/*: опубликовать, поставить в чужом
# проекте, выпустить снова — не выходя в публичный npmjs.
#
# Читать может любой, публиковать — только по учётной записи. Это осознанный размен, названный
# в заявке: пакеты не секретные, а потребителю так не нужен токен в .npmrc, чтобы просто собраться.

storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

web:
  title: web-core registry
  # Ссылки на публичные пакеты ведут на npmjs, а не внутрь: их тела у нас лишь кэш.
  primary_color: '#3f51b5'

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # Самостоятельная регистрация ЗАКРЫТА. Учётку заводит хозяин машины, иначе всякий, кто
    # знает адрес, заведёт себе право публиковать — а читать мы и так разрешили всем.
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    # Кэш обязателен: потребитель ставит наши пакеты вместе с их публичными зависимостями, и
    # без кэша сборка в чужом проекте упиралась бы в сеть на каждом шаге.
    cache: true
    timeout: 30s
    maxage: 2m

packages:
  # Наши пакеты. proxy НЕ указан намеренно: их нет в публичном npmjs, и поход туда за ними
  # означал бы лишний запрос и чужой 404 вместо нашего честного «нет такой версии».
  '@web-core/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated

  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

# Перезапись версии разрешена: на обкатке одну и ту же версию публикуют многократно, и запрет
# остановил бы работу на втором шаге. Для боевого реестра это выключают — здесь полигон.
publish:
  allow_offline: true

log: { type: stdout, format: pretty, level: http }

# Адреса тел пакетов здесь НЕ задаются. Реестр берёт их из переменной `VERDACCIO_PUBLIC_URL`
# (её ставит компоуз) и из заголовков источника, которые шлёт вход.
#
# Своего `url_prefix` тут быть не должно: подстановку переменных в конфиге реестр не делает, и
# `${...}` уезжает в ссылки буквально — установка падает на 404 с именем переменной в адресе.
# Проверено на приёмке, а не предположено.

listen: 0.0.0.0:4873
