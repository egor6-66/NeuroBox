# Единственный поддерживаемый способ запуска.
#
# Здесь только то, что уже существует и работает. База, очередь, воркер и сайдкар приедут вместе
# с кодом, который их использует, — контейнер, который ничего не обслуживает, выглядит рабочей
# частью системы и врёт про её готовность.

# Имя проекта задано явно, а не выведено из имени каталога: по нему называется сеть докера, а на
# эту сеть смотрит вход машины. Выведи его из каталога — и клон в папку с другим именем оказался бы
# для входа другим соседом, при полностью исправном сервисе.
name: neurobox

services:
  api:
    build: ./neurobox
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Только на петлю: снаружи ходит пульт, а прямой доступ к ручкам нужен для отладки на
      # своей машине. На сервере это значит, что снаружи сервис недоступен вовсе.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      # Сервер, поднятый на машине человека, из контейнера доступен как host.docker.internal:
      # 127.0.0.1 внутри контейнера — это он сам. На Docker Desktop имя есть само по себе,
      # на голом Linux его создаёт эта строка — иначе обещание «на любой машине» держится
      # только на одной.
      - "host.docker.internal:host-gateway"
    volumes:
      # Файловый слой правится человеком постоянно и читается на каждый запрос — примонтирован,
      # а не вкопирован в образ, иначе правка требовала бы пересборки. Только на чтение: сервис
      # в этот слой не пишет никогда.
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Пульт: то же, что умеет сервис, но глазами и мышкой. Возможностей мимо API не имеет.
  console:
    build: ./console
    depends_on:
      - api
    ports:
      # Только на петлю. На своей машине пульт открывают с неё же, а на сервере снаружи ходят
      # через вход машины — публикуй мы порт наружу, пульт оказался бы доступен ещё и в обход
      # входа, то есть без TLS.
      #
      # Не 3000: этот порт на машинах разработки часто уже занят чужим сервером, и наш пульт
      # оказывался им перекрыт — при этом контейнер выглядел здоровым, а страница не
      # открывалась. Порт, у которого меньше шансов столкнуться.
      - "127.0.0.1:${CONSOLE_PORT:-3100}:80"

  # Чужое тяжёлое окружение и живущий в нём A2A-агент. Наружу торчит общий протокол, внутри
  # локальный CLI — оркестратор про CLI не знает и знать не обязан.
  claude:
    build: ./sidecar
    environment:
      # Без этого CLI держит основной конфиг в /home/node/.claude.json — на уровень ВЫШЕ тома,
      # то есть вне его. Файл исчезал бы вместе с контейнером на каждом запуске, и CLI ругался
      # бы на пропажу, хотя вход в порядке. Переменная уводит конфиг внутрь тома, к учётным
      # данным.
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Жизнь процесса агента без работы; пустое значение адаптер читает как «не задано» и
      # берёт свои полчаса, а не как ноль.
      AGENT_SESSION_IDLE_MS: ${AGENT_SESSION_IDLE_MS:-}
    ports:
      # Только на петлю — и только чтобы посмотреть визитку глазами и проверить инспектором.
      # Оркестратор ходит по внутренней сети докера, ему публикация не нужна вовсе, а снаружи
      # агент не должен быть доступен ни при каких обстоятельствах: он принимает задачи.
      - "127.0.0.1:${AGENT_PORT:-9100}:9100"
    volumes:
      # Авторизация живёт на именованном томе, а не внутри образа: иначе логин пропадал бы при
      # каждой пересборке, и входить пришлось бы заново каждый раз.
      - claude-auth:/home/node/.claude
      # Память адаптера о том, какая беседа CLI относится к какому контексту. Отдельно от
      # каталога авторизации: чужие данные в чужую папку не подкладываем.
      - agent-state:/state
      - ./config:/config:ro

  # Соседи из сайдкара: MCP зоны скинов и служба пресетов, в которую он пишет. Оба — чужой код
  # (omnifield/probe-web), собираются прямо из его репозитория, здесь только объявлены. Наружу
  # не публикуются: агент ходит по внутренней сети докера, а петля — посмотреть глазами.
  # Ветка probe-web — одна на обоих, задаётся в .env (см. .env.example).
  skin-mcp:
    build:
      context: ./sidecar/skin
      # Цель названа ЯВНО: файл сборки многоступенчатый, и без неё докер берёт последнюю ступень
      # — витрину. Служба поднялась бы раздачей статики вместо MCP, отвечая 200 на всё и ничего
      # не умея.
      target: mcp
      args:
        PROBE_WEB_REF: ${PROBE_WEB_REF:-dev}
    depends_on:
      presets:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SKIN_MCP_PORT:-8788}:8788"

  presets:
    build:
      # Служба целиком лежит в чужом репозитории вместе со своим Dockerfile — контекст берётся
      # оттуда, подкаталогом ветки. Свой Dockerfile здесь был бы копией чужого.
      context: https://github.com/omnifield/probe-web.git#${PROBE_WEB_REF:-dev}:backend/presets
    ports:
      - "127.0.0.1:${PRESETS_PORT:-8787}:8787"
    volumes:
      # Сохранённое агентом — чужие данные; переживают пересборку и перезапуск на томе.
      - presets-data:/data

  # Витрина зоны скинов: то же чужое дерево, другая цель сборки. Наружу её отдаёт вход машины,
  # петля — посмотреть глазами.
  skin-web:
    build:
      context: ./sidecar/skin
      target: web
      args:
        PROBE_WEB_REF: ${PROBE_WEB_REF:-dev}
        # Адреса соседей. По умолчанию ОТНОСИТЕЛЬНЫЕ: витрина отдаётся с того же порта, что и
        # её соседи через её же nginx, — значит для браузера это один источник, и разрешения на
        # чужой источник не нужны. Полный адрес с другим портом сделал бы их разными местами.
        # Переопределяются в .env, когда витрину собирают под другой стенд.
        PRESETS_URL: ${SKIN_WEB_PRESETS_URL:-/presets}
        NEUROBOX_URL: ${SKIN_WEB_BOX_URL:-/api}
        # Токен впечатывается в бандл НА СБОРКЕ — так устроен чат витрины. Сменился токен —
        # пересобрать витрину, иначе её чат останется со старым и будет молча получать 401.
        NEUROBOX_TOKEN: ${ACCESS_TOKEN}
        VITE_CHAT_TOKEN: ${ACCESS_TOKEN}
    restart: unless-stopped
    depends_on:
      - api
      - presets
    ports:
      - "127.0.0.1:${SKIN_WEB_PORT:-5174}:80"

  # Сосед по машине, не часть бокса: свой продукт, свой цикл выпуска, своя база. Живёт здесь
  # только потому, что машина одна — бокс о нём ничего не знает и не зависит от него.
  #
  # Ветка СВОЯ, не общая с зоной скинов: продукты живут в одном репозитории, но выпускаются
  # порознь, и одна переменная на двоих однажды выкатила бы недоделанное вместе с готовым.
  windshift:
    build:
      context: https://github.com/omnifield/probe-web.git#${WINDSHIFT_REF:-main}:products/windshift
    restart: unless-stopped
    environment:
      # Им подписываются сессии и шифруются учётные данные SSO. Обязателен: без него продукт не
      # стартует вовсе, и лучше остановиться здесь со словами, чем крутить контейнер в цикле
      # перезапусков — так и было, пока переменной не стало.
      #
      # ⚠️ При переносе СТАРОЙ базы нужен и старый секрет: сессии и учётки SSO, зашифрованные
      # прежним, новым не расшифруются.
      SSO_SECRET: ${WINDSHIFT_SSO_SECRET:?нужен секрет подписи сессий, смотри .env.example}
      # Внешний адрес, по которому продукт открывают. Из него он выводит список разрешённых
      # источников для защиты от подделки запросов: без адреса список пуст, и вход отбивается —
      # страница открывается, а войти нельзя.
      BASE_URL: ${WINDSHIFT_BASE_URL:-}
    ports:
      # Только на петлю: снаружи к нему ходят через вход машины, как и ко всем остальным.
      - "127.0.0.1:${WINDSHIFT_PORT:-8080}:8080"
    volumes:
      # База, вложения, плагины и промпты — всё в одном каталоге, так задумано самим продуктом.
      - windshift-data:/data

  # Единственное хранилище состояния сервиса: сессии, история, прогоны, расход. Каталог здесь
  # НЕ лежит — он приходит слоями и перечитывается с диска.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurobox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurobox}
      POSTGRES_DB: ${POSTGRES_DB:-neurobox}
    ports:
      # Только на петлю: база видна инструментам на этой машине и никому в сети.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Сервис ждёт не «контейнер запущен», а «база отвечает»: без этого первая миграция
      # стучится в ещё не поднятый постгрес и падает на ровном месте.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurobox} -d ${POSTGRES_DB:-neurobox}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  claude-auth:
  windshift-data:
  agent-state:
  db-data:
  presets-data:
