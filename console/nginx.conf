# Пульт и сервис отдаются с одного источника: так не нужны разрешения на чужие источники,
# а поведение в разработке и в сборке не расходится.
server {
    listen 80;

    location /api/ {
        # Имя сервиса разрешается на КАЖДЫЙ запрос, а не один раз при старте. Без этого nginx
        # запоминает адрес контейнера навсегда, и первый же его перезапуск даёт 502 при живом
        # сервисе — ошибка, по которой не догадаешься о причине. 127.0.0.11 — служба имён докера.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $service "api:8000";

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$service;
        proxy_http_version 1.1;

        # Поток событий не должен буферизоваться: иначе шаги прогона копятся у посредника и
        # приходят пачкой в конце — то есть ровно тогда, когда они уже не нужны.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
